<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Push-Ups</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Push-Ups">
<meta name="theme-color" content="#f5f5f7">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120.png">
<link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    background: #f5f5f7; color: #111;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 12px 16px 40px; }
  .hidden { display: none !important; }

  /* Header */
  .topbar { display: flex; align-items: center; justify-content: space-between; margin: 10px 4px 14px; }
  .topbar h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; margin: 0; }
  .topbar.center { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; }
  .topbar.center h1 { text-align: center; }
  .topbtns { display: flex; gap: 8px; }
  .iconbtn {
    width: 44px; height: 44px; border-radius: 999px; border: none; background: #ececf1;
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
  }
  .iconbtn:active { transform: scale(.94); }
  .iconbtn svg { width: 22px; height: 22px; stroke: #111; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Segmented control */
  .seg { display: flex; background: #e9e9ee; border-radius: 14px; padding: 3px; margin-bottom: 14px; }
  .seg button {
    flex: 1; border: none; background: transparent; font-size: 17px; font-weight: 500;
    padding: 9px 0; border-radius: 11px; cursor: pointer; color: #111; font-family: inherit;
  }
  .seg button.on { background: #22b14c; color: #fff; font-weight: 700; }

  /* Cards */
  .card { background: #e9f8ef; border-radius: 22px; padding: 20px; margin-bottom: 14px; }
  .card.plain { background: #ececf1; }
  .logcard { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 12px; }

  /* Chart (month/year: fixed flex) */
  .chart { height: 190px; display: flex; align-items: stretch; gap: 6px; }
  .bcol { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-width: 0; cursor: pointer; }
  .bval { font-size: 13px; font-weight: 800; color: #22b14c; height: 18px; margin-bottom: 4px; white-space: nowrap; }
  .bbar { width: 100%; max-width: 44px; background: #a9e5bd; border-radius: 9px 9px 4px 4px; min-height: 0; }
  .bcol.cur .bbar { background: #22b14c; }
  .bcol.sel .bbar { background: #22b14c; box-shadow: 0 0 0 3px rgba(34,177,76,.25); }
  .bcol.dim { opacity: .35; }
  .blab { font-size: 13px; color: #8e8e93; margin-top: 6px; font-weight: 500; }
  .bcol.cur .blab, .bcol.sel .blab { color: #111; font-weight: 800; }

  /* Chart (week: horizontal scroll) */
  .wscroll { height: 190px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .wscroll::-webkit-scrollbar { display: none; }
  .wtrack { display: flex; gap: 6px; height: 100%; min-width: 100%; width: max-content; align-items: stretch; }
  .wcol { flex: 0 0 44px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; cursor: pointer; }
  .wcol .bbar { width: 44px; }
  .wcol.cur .bbar { background: #22b14c; }
  .wcol.sel .bbar { background: #22b14c; box-shadow: 0 0 0 3px rgba(34,177,76,.25); }
  .wcol.dim { opacity: .35; }
  .wcol.cur .blab, .wcol.sel .blab { color: #111; font-weight: 800; }

  .baseline { height: 1px; background: #d1d1d6; margin-top: 2px; }
  .hint { text-align: center; color: #aeaeb2; font-size: 12.5px; margin-top: 10px; }

  /* Stats grid */
  .period-title { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; margin: 0 0 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 12px; }
  .stat .v { font-size: 31px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1; }
  .stat .v .u { font-size: 16px; font-weight: 800; color: #22b14c; margin-left: 3px; letter-spacing: 0; }
  .stat .l { font-size: 12px; color: #8e8e93; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; margin-top: 3px; }
  .goalbar { height: 8px; background: #d7efe0; border-radius: 5px; margin-top: 18px; overflow: hidden; }
  .goalbar > div { height: 100%; background: #22b14c; border-radius: 5px; }

  /* Best day */
  .best-date { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
  .best-tag { color: #22b14c; font-weight: 800; font-size: 15px; letter-spacing: 0.4px; margin: 2px 0 14px; text-transform: uppercase; }
  .best-cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

  /* Section titles */
  .section-title { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; margin: 22px 4px 10px; }

  /* Logger (classic scheme) */
  .logcard .date-row { margin-bottom: 12px; }
  .logcard .date-row input[type="date"] {
    width: 100%; font-size: 17px; padding: 13px 14px; border: none; border-radius: 12px;
    background: #f0f0f4; font-family: inherit; font-weight: 600;
  }
  .quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 10px; }
  .quick button {
    font-size: 22px; font-weight: 800; padding: 18px 0; border: none; border-radius: 14px;
    background: #111; color: #fff; cursor: pointer; font-family: inherit;
  }
  .quick button:active { transform: scale(.95); opacity: .85; }
  .custom-row { display: flex; gap: 10px; }
  .custom-row input {
    flex: 1; font-size: 19px; padding: 14px; border: none; border-radius: 14px;
    text-align: center; font-family: inherit; background: #f0f0f4; min-width: 0; font-weight: 600;
  }
  .custom-row button {
    font-size: 17px; font-weight: 800; padding: 0 24px; border: none; border-radius: 14px;
    background: #007aff; color: #fff; cursor: pointer; font-family: inherit;
  }
  .custom-row button:active { transform: scale(.95); }
  .sets-label { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #8e8e93; margin: 16px 0 8px; }
  .sets { display: flex; flex-wrap: wrap; gap: 8px; }
  .set-chip {
    display: inline-flex; align-items: center; gap: 6px; background: #f0f0f4; border-radius: 999px;
    padding: 9px 9px 9px 15px; font-size: 17px; font-weight: 700;
  }
  .set-chip button {
    border: none; background: #e2e2e6; color: #111; border-radius: 999px; width: 26px; height: 26px;
    font-size: 15px; line-height: 1; cursor: pointer; font-weight: 700;
  }
  .empty-note { color: #8e8e93; font-size: 15px; }
  .day-total { width: 100%; font-weight: 800; font-size: 17px; margin-top: 6px; }

  /* History */
  .hist-toggle {
    display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 800;
    letter-spacing: -0.3px; margin: 22px 4px 10px; cursor: pointer; user-select: none; -webkit-user-select: none;
  }
  .hist-toggle .chev { color: #007aff; font-size: 16px; }
  .day { border-bottom: 1px solid #e5e5ea; padding: 11px 2px; }
  .day:last-child { border-bottom: none; }
  .day-head { display: flex; justify-content: space-between; align-items: center; font-size: 16px; cursor: pointer; padding: 2px 0; }
  .day-head .d { font-weight: 700; }
  .day-head .t { font-weight: 800; }
  .day-sets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

  /* Goal + backup */
  .goal-row { display: flex; gap: 10px; align-items: center; }
  .goal-row input {
    flex: 1; font-size: 19px; padding: 13px 14px; border: none; border-radius: 12px;
    font-family: inherit; background: #f0f0f4; min-width: 0; font-weight: 700;
  }
  .goal-row button {
    font-size: 16px; font-weight: 800; padding: 13px 20px; border: none; border-radius: 12px;
    background: #007aff; color: #fff; cursor: pointer; font-family: inherit;
  }
  .backup-row { display: flex; gap: 10px; }
  .backup-row button, .backup-row label {
    flex: 1; text-align: center; font-size: 16px; font-weight: 700; padding: 14px 0;
    border: none; border-radius: 12px; background: #fff; cursor: pointer; font-family: inherit; color: #111;
  }
  .backup-row button:active, .backup-row label:active { transform: scale(.97); }
  .danger { color: #c00 !important; }
  .foot { text-align: center; color: #aeaeb2; font-size: 13px; margin-top: 26px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ LOGGER (main) ============ -->
  <div id="logView">
    <div class="topbar">
      <h1>Push-Ups</h1>
      <div class="topbtns">
        <button class="iconbtn" id="trendsBtn" aria-label="Open trends">
          <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>
        </button>
        <button class="iconbtn" id="shareBtn" aria-label="Export backup">
          <svg viewBox="0 0 24 24"><path d="M12 3v13m0-13L7 8m5-5l5 5M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8"/></svg>
        </button>
      </div>
    </div>

    <div class="logcard">
      <div class="date-row"><input type="date" id="datePicker"></div>
      <div class="quick" id="quickBtns"></div>
      <div class="custom-row">
        <input type="number" id="customReps" inputmode="numeric" min="1" placeholder="Custom reps">
        <button id="customAdd">Add</button>
      </div>
      <div class="sets-label" id="setsTitle">Today's sets</div>
      <div class="sets" id="setsList"></div>
    </div>

    <div class="hist-toggle" id="historyToggle"><span class="chev" id="historyChev">▸</span>History <span id="historyCount"></span></div>
    <div class="logcard hidden" id="historyCard"></div>

    <div class="section-title">Goal</div>
    <div class="logcard">
      <div class="goal-row">
        <input type="number" id="goalInput" inputmode="numeric" min="1">
        <button id="goalSave">Save</button>
      </div>
    </div>

    <div class="section-title">Backup</div>
    <div class="card plain">
      <div class="backup-row">
        <button id="exportBtn">Export</button>
        <label for="importFile">Import</label>
        <input type="file" id="importFile" accept="application/json" class="hidden">
      </div>
      <div class="backup-row" style="margin-top:10px">
        <button id="resetBtn" class="danger">Delete all data</button>
      </div>
    </div>

    <div class="foot">Data stays on this phone. Export a backup now and then.</div>
  </div>

  <!-- ============ TRENDS (behind button) ============ -->
  <div id="trendsView" class="hidden">
    <div class="topbar center">
      <button class="iconbtn" id="closeTrends" aria-label="Close trends">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <h1>Trends</h1>
      <button class="iconbtn" id="shareBtn2" aria-label="Export backup">
        <svg viewBox="0 0 24 24"><path d="M12 3v13m0-13L7 8m5-5l5 5M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8"/></svg>
      </button>
    </div>

    <div class="seg" id="seg">
      <button data-p="week" class="on">Week</button>
      <button data-p="month">Month</button>
      <button data-p="year">Year</button>
    </div>

    <div class="card">
      <div id="chart"></div>
      <div class="baseline"></div>
      <div class="hint" id="chartHint">Tap a bar to focus on that period · tap again to reset</div>
    </div>

    <div class="card">
      <div class="period-title" id="periodTitle"></div>
      <div class="grid" id="statGrid"></div>
      <div class="goalbar" id="goalBarWrap"><div id="goalBar" style="width:0%"></div></div>
    </div>

    <div class="card" id="bestCard">
      <div class="best-date" id="bestDate"></div>
      <div class="best-tag">Best day</div>
      <div class="best-cols">
        <div class="stat"><div class="v" id="bestTotal">–</div><div class="l">Push-ups</div></div>
        <div class="stat"><div class="v" id="bestSets">–</div><div class="l">Sets</div></div>
        <div class="stat"><div class="v" id="bestSingle">–</div><div class="l">Best set</div></div>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  "use strict";
  var KEY = "pushup-tracker-v1";
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var SMS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function dateKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayStr() { return dateKey(new Date()); }
  function parseDay(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fmt(n) { return Math.round(n).toLocaleString("en-US"); }
  function compact(n) {
    n = Math.round(n);
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "k";
    return "" + n;
  }
  function fmtLong(s) {
    var d = parseDay(s);
    return MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
  }
  function fmtLongD(d) {
    return MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
  }
  function fmtShort(d) { return SMS[d.getMonth()] + " " + d.getDate(); }
  function daysInYear(y) { return ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) ? 366 : 365; }
  function dayOfYear(d) { return Math.floor((d - new Date(d.getFullYear(), 0, 1)) / 86400000) + 1; }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && typeof s === "object") {
          return { goal: +s.goal > 0 ? Math.floor(+s.goal) : 50000, days: s.days && typeof s.days === "object" ? s.days : {} };
        }
      }
    } catch (e) {}
    return { goal: 50000, days: {} };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var state = load();
  var selectedDate = todayStr();
  var period = "week";
  var selSlice = null;
  var historyOpen = false;
  var $ = function (id) { return document.getElementById(id); };

  function daySum(k) {
    var arr = state.days[k] || [], s = 0;
    for (var i = 0; i < arr.length; i++) s += arr[i];
    return s;
  }
  function daySets(k) { return (state.days[k] || []).length; }
  function dayBest(k) {
    var arr = state.days[k] || [], m = 0;
    for (var i = 0; i < arr.length; i++) if (arr[i] > m) m = arr[i];
    return m;
  }
  function agg(days) {
    var total = 0, sets = 0, trained = 0, bestDay = 0, bestDayKey = "", bestSet = 0;
    days.forEach(function (d) {
      var k = dateKey(d), s = daySum(k);
      total += s; sets += daySets(k);
      if (s > 0) trained++;
      if (s > bestDay) { bestDay = s; bestDayKey = k; }
      var bs = dayBest(k);
      if (bs > bestSet) bestSet = bs;
    });
    return { total: total, sets: sets, trained: trained, bestDay: bestDay, bestDayKey: bestDayKey, bestSet: bestSet };
  }
  function statEl(val, unit, label) {
    var el = document.createElement("div"); el.className = "stat";
    var v = document.createElement("div"); v.className = "v"; v.textContent = val;
    if (unit) { var u = document.createElement("span"); u.className = "u"; u.textContent = unit; v.appendChild(u); }
    var l = document.createElement("div"); l.className = "l"; l.textContent = label;
    el.appendChild(v); el.appendChild(l);
    return el;
  }

  /* ---------- Trends: data builders ---------- */
  function buildWeeks() {
    var now = new Date(); now.setHours(0, 0, 0, 0);
    var start = new Date(now);
    var keys = Object.keys(state.days);
    if (keys.length) start = parseDay(keys.sort()[0]);
    start.setDate(start.getDate() - start.getDay()); // back to Sunday
    var weeks = [], curIdx = 0, w = new Date(start), wi = 0;
    while (w <= now) {
      var dys = [];
      for (var i = 0; i < 7; i++) {
        var d = new Date(w); d.setDate(d.getDate() + i);
        if (d > now) break;
        dys.push(d);
      }
      var wEnd = new Date(w); wEnd.setDate(wEnd.getDate() + 6);
      var isCur = now >= w && now <= wEnd;
      if (isCur) curIdx = wi;
      var lab = "";
      for (var j = 0; j < dys.length; j++) {
        if (dys[j].getDate() === 1) { lab = SMS[dys[j].getMonth()].toUpperCase(); break; }
      }
      weeks.push({
        days: dys, cur: isCur, label: lab,
        title: fmtShort(dys[0]) + " – " + fmtLongD(dys[dys.length - 1])
      });
      w.setDate(w.getDate() + 7); wi++;
    }
    return { weeks: weeks, curIdx: curIdx, now: now };
  }

  function buildSlices() {
    // month + year only (week has its own builder)
    var now = new Date(); now.setHours(0, 0, 0, 0);
    var slices = [], title = "";
    var i, dd;
    if (period === "month") {
      var y = now.getFullYear(), m = now.getMonth();
      title = MONTHS[m];
      for (i = 0; i <= m; i++) {
        var dim = new Date(y, i + 1, 0).getDate();
        var dys = [];
        for (dd = 1; dd <= dim; dd++) dys.push(new Date(y, i, dd));
        slices.push({ label: MONTHS[i].charAt(0), days: dys, cur: i === m, title: MONTHS[i] + " " + y, dim: dim });
      }
    } else {
      title = "" + now.getFullYear();
      var years = {};
      Object.keys(state.days).forEach(function (k) { years[k.slice(0, 4)] = true; });
      years[now.getFullYear()] = true;
      Object.keys(years).sort().forEach(function (yy) {
        yy = +yy;
        var dys2 = [], diy = daysInYear(yy), j;
        for (j = 1; j <= diy; j++) dys2.push(new Date(yy, 0, j));
        slices.push({ label: "" + yy, days: dys2, cur: yy === now.getFullYear(), title: "" + yy, diy: diy });
      });
    }
    return { slices: slices, title: title, now: now };
  }

  /* ---------- Trends: render ---------- */
  function barCol(cls, val, label, selected, dimmed, onTap) {
    var col = document.createElement("div");
    col.className = cls + (selected ? " sel" : "") + (dimmed ? " dim" : "");
    var v = document.createElement("div"); v.className = "bval"; v.textContent = val;
    var bar = document.createElement("div"); bar.className = "bbar"; bar.style.height = "0";
    var lab = document.createElement("div"); lab.className = "blab"; lab.textContent = label;
    col.appendChild(v); col.appendChild(bar); col.appendChild(lab);
    col.addEventListener("click", onTap);
    return { col: col, bar: bar };
  }

  function renderTrends() {
    var now = new Date(); now.setHours(0, 0, 0, 0);
    var g = $("statGrid"); g.innerHTML = "";
    var showGoalBar = false;
    var best = null, bestDays = [];

    if (period === "week") {
      var bw = buildWeeks();
      var weeks = bw.weeks;
      if (selSlice == null || selSlice < 0 || selSlice >= weeks.length) selSlice = null;
      var selIdx = selSlice == null ? bw.curIdx : selSlice;
      var wk = weeks[selIdx];

      // scrollable chart of weekly bars
      var ch = $("chart"); ch.innerHTML = "";
      ch.className = "";
      var sc = document.createElement("div"); sc.className = "wscroll";
      var track = document.createElement("div"); track.className = "wtrack";
      var totals = weeks.map(function (x) { return agg(x.days).total; });
      var max = 0;
      totals.forEach(function (t) { if (t > max) max = t; });
      weeks.forEach(function (x, i) {
        var isSel = i === selIdx;
        var showVal = isSel && totals[i] > 0;
        var bc = barCol("wcol" + (x.cur ? " cur" : ""), showVal ? compact(totals[i]) : "", x.label, isSel, selSlice != null && !isSel, function () {
          selSlice = (selSlice === i ? null : i);
          renderTrends();
        });
        bc.bar.style.height = max > 0 && totals[i] > 0 ? Math.max(3, (totals[i] / max) * 100) + "%" : "0";
        track.appendChild(bc.col);
      });
      sc.appendChild(track);
      ch.appendChild(sc);
      sc.scrollLeft = sc.scrollWidth; // start at current week

      var a = agg(wk.days);
      var dg = state.goal / daysInYear(now.getFullYear());
      var above = 0;
      wk.days.forEach(function (d) { if (daySum(dateKey(d)) >= dg) above++; });
      $("periodTitle").textContent = wk.title;
      g.appendChild(statEl(fmt(a.total), "", "Total push-ups"));
      g.appendChild(statEl((a.total / 7).toFixed(1), "", "Average / day"));
      g.appendChild(statEl(fmt(a.sets), "", "Total sets"));
      g.appendChild(statEl(fmt(a.trained), "", "Days trained"));
      g.appendChild(statEl(fmt(a.bestDay), "", "Best day"));
      g.appendChild(statEl(fmt(a.bestSet), "", "Best set"));
      g.appendChild(statEl(fmt(above), "days", "Above daily goal"));
      g.appendChild(statEl(Math.round((a.total / (dg * 7)) * 100), "%", "Of weekly goal"));
      best = a; bestDays = wk.days;
      $("chartHint").textContent = "Swipe to browse weeks · tap a bar to focus";
    } else {
      var b = buildSlices();
      if (selSlice != null && selSlice >= b.slices.length) selSlice = null;
      var sel = selSlice == null ? null : b.slices[selSlice];
      var sliceTotals = b.slices.map(function (sl) { return agg(sl.days).total; });
      var max2 = 0;
      sliceTotals.forEach(function (t) { if (t > max2) max2 = t; });

      var ch2 = $("chart"); ch2.innerHTML = "";
      ch2.className = "chart";
      b.slices.forEach(function (sl, i) {
        var showVal = selSlice != null ? (i === selSlice) : sl.cur;
        var bc = barCol("bcol" + (sl.cur ? " cur" : ""), showVal && sliceTotals[i] > 0 ? compact(sliceTotals[i]) : "", sl.label, selSlice === i, selSlice != null && selSlice !== i, function () {
          selSlice = (selSlice === i ? null : i);
          renderTrends();
        });
        bc.bar.style.height = max2 > 0 && sliceTotals[i] > 0 ? Math.max(3, (sliceTotals[i] / max2) * 100) + "%" : "0";
        ch2.appendChild(bc.col);
      });

      var days = sel ? sel.days : b.slices.reduce(function (acc, sl) { return acc.concat(sl.days); }, []);
      var a2 = agg(days);
      $("periodTitle").textContent = sel ? sel.title : b.title;

      if (period === "year") {
        if (!sel || sel.cur) {
          var elapsed = dayOfYear(now);
          var avg = elapsed > 0 ? a2.total / elapsed : 0;
          g.appendChild(statEl(fmt(a2.total), "", "Total push-ups"));
          g.appendChild(statEl(avg.toFixed(1), "", "Average / day"));
          g.appendChild(statEl(fmt(a2.sets), "", "Total sets"));
          g.appendChild(statEl(fmt(a2.trained), "", "Days trained"));
          g.appendChild(statEl(fmt(a2.bestSet), "", "Best set"));
          g.appendChild(statEl(fmt(a2.bestDay), "", "Best day"));
          g.appendChild(statEl(Math.round((a2.total / state.goal) * 100), "%", "Of goal"));
          g.appendChild(statEl(a2.total >= state.goal ? "Done" : fmt(state.goal - a2.total), "", "To go"));
          $("goalBar").style.width = Math.min(100, (a2.total / state.goal) * 100) + "%";
          showGoalBar = true;
        } else {
          var avgY = sel.diy > 0 ? a2.total / sel.diy : 0;
          g.appendChild(statEl(fmt(a2.total), "", "Total push-ups"));
          g.appendChild(statEl(avgY.toFixed(1), "", "Average / day"));
          g.appendChild(statEl(fmt(a2.sets), "", "Total sets"));
          g.appendChild(statEl(fmt(a2.trained), "", "Days trained"));
          g.appendChild(statEl(fmt(a2.bestDay), "", "Best day"));
          g.appendChild(statEl(fmt(a2.bestSet), "", "Best set"));
        }
      } else { // month
        if (!sel || sel.cur) {
          var dimNow = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
          var elapsedM = now.getDate();
          var avgM = elapsedM > 0 ? a2.total / elapsedM : 0;
          g.appendChild(statEl(fmt(a2.total), "", "Total push-ups"));
          g.appendChild(statEl(avgM.toFixed(1), "", "Average / day"));
          g.appendChild(statEl(fmt(a2.sets), "", "Total sets"));
          g.appendChild(statEl(fmt(a2.trained), "", "Days trained"));
          g.appendChild(statEl(fmt(a2.bestDay), "", "Best day"));
          g.appendChild(statEl(fmt(a2.bestSet), "", "Best set"));
          g.appendChild(statEl(fmt(dimNow - elapsedM), "", "Days left"));
          g.appendChild(statEl(fmt(a2.total + avgM * (dimNow - elapsedM)), "", "Projected"));
        } else {
          var avgS = sel.dim > 0 ? a2.total / sel.dim : 0;
          g.appendChild(statEl(fmt(a2.total), "", "Total push-ups"));
          g.appendChild(statEl(avgS.toFixed(1), "", "Average / day"));
          g.appendChild(statEl(fmt(a2.sets), "", "Total sets"));
          g.appendChild(statEl(fmt(a2.trained), "", "Days trained"));
          g.appendChild(statEl(fmt(a2.bestDay), "", "Best day"));
          g.appendChild(statEl(fmt(a2.bestSet), "", "Best set"));
        }
      }
      best = a2; bestDays = days;
      $("chartHint").textContent = "Tap a bar to focus on that period · tap again to reset";
    }

    $("goalBarWrap").style.display = showGoalBar ? "" : "none";
    if (best && best.bestDayKey && bestDays.length > 1) {
      $("bestCard").style.display = "";
      $("bestDate").textContent = fmtLong(best.bestDayKey);
      $("bestTotal").textContent = fmt(best.bestDay);
      $("bestSets").textContent = fmt(daySets(best.bestDayKey));
      $("bestSingle").textContent = fmt(dayBest(best.bestDayKey));
    } else {
      $("bestCard").style.display = "none";
    }
  }

  function openTrends() {
    $("logView").classList.add("hidden");
    $("trendsView").classList.remove("hidden");
    window.scrollTo(0, 0);
    renderTrends();
  }
  function closeTrends() {
    $("trendsView").classList.add("hidden");
    $("logView").classList.remove("hidden");
    window.scrollTo(0, 0);
  }

  /* ---------- Logging ---------- */
  function renderLogCard() {
    $("goalInput").value = state.goal;
    $("datePicker").value = selectedDate;
    $("setsTitle").textContent = (selectedDate === todayStr() ? "Today's" : fmtLong(selectedDate) + "'s") + " sets";
    var sets = state.days[selectedDate] || [];
    var list = $("setsList");
    list.innerHTML = "";
    if (!sets.length) {
      var n = document.createElement("div");
      n.className = "empty-note";
      n.textContent = "Nothing logged for this date yet.";
      list.appendChild(n);
    } else {
      var sum = 0;
      sets.forEach(function (r, i) {
        sum += r;
        var chip = document.createElement("span");
        chip.className = "set-chip";
        chip.appendChild(document.createTextNode(r + " "));
        var x = document.createElement("button");
        x.textContent = "×";
        x.setAttribute("aria-label", "Remove set of " + r);
        x.onclick = function () { removeSet(i); };
        chip.appendChild(x);
        list.appendChild(chip);
      });
      var tot = document.createElement("div");
      tot.className = "day-total";
      tot.textContent = "Day total: " + fmt(sum);
      list.appendChild(tot);
    }
    renderQuick();
  }

  function renderQuick() {
    var el = $("quickBtns");
    el.innerHTML = "";
    var seen = {}, vals = [];
    var keys = Object.keys(state.days).sort().reverse();
    for (var ki = 0; ki < keys.length && vals.length < 4; ki++) {
      var arr = state.days[keys[ki]];
      for (var i = arr.length - 1; i >= 0 && vals.length < 4; i--) {
        if (!seen[arr[i]]) { seen[arr[i]] = true; vals.push(arr[i]); }
      }
    }
    [25, 40, 50, 60].forEach(function (d) {
      if (vals.length < 4 && vals.indexOf(d) === -1) vals.push(d);
    });
    vals.sort(function (a, b) { return a - b; });
    vals.forEach(function (v) {
      var b = document.createElement("button");
      b.textContent = v;
      b.addEventListener("click", function () { addReps(v); });
      el.appendChild(b);
    });
  }

  function renderHistory() {
    var card = $("historyCard");
    card.innerHTML = "";
    var keys = Object.keys(state.days).filter(function (k) { return state.days[k].length; }).sort().reverse();
    if (!keys.length) {
      var n = document.createElement("div");
      n.className = "empty-note";
      n.textContent = "No entries yet.";
      card.appendChild(n);
      return;
    }
    keys.forEach(function (k) {
      var arr = state.days[k];
      var sum = arr.reduce(function (a, b) { return a + b; }, 0);
      var day = document.createElement("div");
      day.className = "day";
      var head = document.createElement("div");
      head.className = "day-head";
      var dl = document.createElement("span");
      dl.className = "d";
      dl.textContent = fmtLong(k) + (k === todayStr() ? " (today)" : "");
      var dr = document.createElement("span");
      dr.className = "t";
      dr.textContent = fmt(sum);
      head.appendChild(dl); head.appendChild(dr);
      var body = document.createElement("div");
      body.className = "day-sets hidden";
      arr.forEach(function (r, i) {
        var chip = document.createElement("span");
        chip.className = "set-chip";
        chip.appendChild(document.createTextNode(r + " "));
        var x = document.createElement("button");
        x.textContent = "×";
        x.setAttribute("aria-label", "Remove set of " + r + " on " + fmtLong(k));
        x.onclick = function (e) { e.stopPropagation(); removeSetAt(k, i); };
        chip.appendChild(x);
        body.appendChild(chip);
      });
      head.onclick = function () { body.classList.toggle("hidden"); };
      day.appendChild(head); day.appendChild(body);
      card.appendChild(day);
    });
  }

  function renderHistoryToggle() {
    var n = Object.keys(state.days).filter(function (k) { return state.days[k].length; }).length;
    $("historyCount").textContent = n ? "(" + n + ")" : "";
    $("historyChev").textContent = historyOpen ? "▾" : "▸";
    $("historyCard").classList.toggle("hidden", !historyOpen);
  }

  function renderLog() {
    renderLogCard();
    renderHistory();
    renderHistoryToggle();
  }

  function addReps(n) {
    n = Math.floor(+n);
    if (!(n > 0)) return;
    if (!state.days[selectedDate]) state.days[selectedDate] = [];
    state.days[selectedDate].push(n);
    save(); renderLog();
  }
  function removeSet(i) {
    var arr = state.days[selectedDate];
    if (arr) { arr.splice(i, 1); if (!arr.length) delete state.days[selectedDate]; }
    save(); renderLog();
  }
  function removeSetAt(k, i) {
    var arr = state.days[k];
    if (arr) { arr.splice(i, 1); if (!arr.length) delete state.days[k]; }
    save(); renderLog(); renderHistory(); renderHistoryToggle();
  }

  /* ---------- Events ---------- */
  $("trendsBtn").addEventListener("click", openTrends);
  $("closeTrends").addEventListener("click", closeTrends);

  var segBtns = $("seg").querySelectorAll("button");
  for (var si = 0; si < segBtns.length; si++) {
    (function (b) {
      b.addEventListener("click", function () {
        for (var j = 0; j < segBtns.length; j++) segBtns[j].classList.remove("on");
        b.classList.add("on");
        period = b.getAttribute("data-p");
        selSlice = null;
        renderTrends();
      });
    })(segBtns[si]);
  }

  $("customAdd").addEventListener("click", function () {
    addReps($("customReps").value);
    $("customReps").value = "";
  });
  $("customReps").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { addReps($("customReps").value); $("customReps").value = ""; }
  });
  $("datePicker").addEventListener("change", function () {
    if ($("datePicker").value) { selectedDate = $("datePicker").value; renderLog(); }
  });
  $("goalSave").addEventListener("click", function () {
    var g = Math.floor(+$("goalInput").value);
    if (g > 0) { state.goal = g; save(); renderLog(); }
  });
  $("historyToggle").addEventListener("click", function () {
    historyOpen = !historyOpen;
    renderHistoryToggle();
  });

  function doExport() {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "pushup-backup-" + todayStr() + ".json";
    document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 500);
  }
  $("exportBtn").addEventListener("click", doExport);
  $("shareBtn").addEventListener("click", doExport);
  $("shareBtn2").addEventListener("click", doExport);
  $("importFile").addEventListener("change", function () {
    var f = $("importFile").files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var s = JSON.parse(r.result);
        if (s && typeof s.days === "object") {
          if (+s.goal > 0) state.goal = Math.floor(+s.goal);
          state.days = s.days;
          save(); renderLog();
          alert("Backup restored.");
        } else { alert("That file doesn't look like a push-up backup."); }
      } catch (e) { alert("Couldn't read that file."); }
    };
    r.readAsText(f);
    $("importFile").value = "";
  });
  $("resetBtn").addEventListener("click", function () {
    if (confirm("Delete ALL push-up data on this phone? This can't be undone. Export a backup first!")) {
      state = { goal: 50000, days: {} };
      selectedDate = todayStr();
      save(); renderLog();
    }
  });

  renderLog();
})();
</script>
</body>
</html>
